<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
      </pattern>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
      </marker>
      <marker id="arrowslate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
      </marker>
    </defs>
    <rect width="1200" height="980" fill="#020617"/>
    <rect width="1200" height="980" fill="url(#grid)"/>

    <!-- ===== flow arrows (behind boxes) ===== -->
    <line x1="450" y1="240" x2="450" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="450" y1="380" x2="450" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="450" y1="550" x2="450" y2="590" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="450" y1="760" x2="450" y2="800" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="890" y1="180" x2="862" y2="180" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrowslate)"/>
    <line x1="890" y1="470" x2="862" y2="470" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrowslate)"/>
    <line x1="890" y1="640" x2="862" y2="640" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrowslate)"/>

    <text x="458" y="266" fill="#64748b" font-size="8" font-family="ui-monospace, monospace">raw sector / page / record stream</text>
    <text x="458" y="406" fill="#64748b" font-size="8" font-family="ui-monospace, monospace">decrypted volumes · partitions</text>
    <text x="458" y="576" fill="#64748b" font-size="8" font-family="ui-monospace, monospace">file bytes · path → inode → block</text>
    <text x="458" y="786" fill="#64748b" font-size="8" font-family="ui-monospace, monospace">events · findings · records</text>

    <!-- ===== evidence row ===== -->
    <rect x="40" y="40" width="360" height="40" rx="6" fill="#0f172a"/>
    <rect x="40" y="40" width="360" height="40" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="220" y="64" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">disk images · memory dumps · archives · live systems</text>
    <line x1="220" y1="80" x2="220" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <rect x="470" y="40" width="390" height="40" rx="6" fill="#0f172a"/>
    <rect x="470" y="40" width="390" height="40" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="665" y="64" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">logs · content-addressed stores · point-in-time snapshots</text>
    <line x1="665" y1="80" x2="665" y2="590" stroke="#475569" stroke-width="1" stroke-dasharray="2,4"/>

    <!-- ===== band 1: ACQUIRE ===== -->
    <text x="40" y="104" fill="#475569" font-size="8" font-family="ui-monospace, monospace" letter-spacing="2">DECODE THE CONTAINER</text>
    <rect x="40" y="110" width="360" height="130" rx="6" fill="#0f172a"/>
    <rect x="40" y="110" width="360" height="130" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="220" y="132" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">container/ (8)</text>
    <text x="220" y="150" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">image format → addressable byte stream</text>
    <text x="220" y="176" fill="#fcd34d" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">ewf · vmdk · vhdx · vhd · qcow2</text>
    <text x="220" y="192" fill="#fcd34d" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">dmg · aff4 · ad1</text>
    <rect x="415" y="110" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="415" y="110" width="140" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="485" y="132" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">acquisition/ (1)</text>
    <text x="485" y="150" fill="#fcd34d" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">livedisk</text>
    <rect x="415" y="180" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="415" y="180" width="140" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="485" y="202" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">memory/ (1)</text>
    <text x="485" y="220" fill="#fcd34d" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">memory-forensic</text>
    <rect x="570" y="110" width="290" height="130" rx="6" fill="#0f172a"/>
    <rect x="570" y="110" width="290" height="130" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="715" y="132" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">archive/ (3)</text>
    <text x="715" y="150" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">file containers</text>
    <text x="715" y="176" fill="#fcd34d" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">archive-forensic · dar · zip</text>

    <!-- ===== band 2: UNLOCK ===== -->
    <text x="40" y="274" fill="#475569" font-size="8" font-family="ui-monospace, monospace" letter-spacing="2">FIND &amp; UNLOCK VOLUMES</text>
    <rect x="40" y="280" width="300" height="100" rx="6" fill="#0f172a"/>
    <rect x="40" y="280" width="300" height="100" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="190" y="302" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">partition/ (3)</text>
    <text x="190" y="320" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">partition schemes</text>
    <text x="190" y="344" fill="#c4b5fd" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">apm · gpt · mbr (-partition)</text>
    <rect x="360" y="280" width="500" height="100" rx="6" fill="#0f172a"/>
    <rect x="360" y="280" width="500" height="100" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="610" y="302" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">encryption/ (6)</text>
    <text x="610" y="320" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">crypto layers + bespoke primitives</text>
    <text x="610" y="344" fill="#fda4af" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">bitlocker · dpapi · elephant-diffuser · filevault · luks · veracrypt</text>

    <!-- ===== band 3: NAVIGATE ===== -->
    <text x="40" y="414" fill="#475569" font-size="8" font-family="ui-monospace, monospace" letter-spacing="2">NAVIGATE THE FILESYSTEM</text>
    <rect x="40" y="420" width="820" height="130" rx="6" fill="#0f172a"/>
    <rect x="40" y="420" width="820" height="130" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="450" y="442" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">filesystem/ (16)</text>
    <text x="450" y="460" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">name → inode → blocks · one Vfs::open() for any stack (E01 → GPT → BitLocker → NTFS)</text>
    <text x="450" y="486" fill="#6ee7b7" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">ntfs · ext4fs · apfs · hfsplus · fat · xfs · zfs · btrfs · ufs · refs · udf · iso9660</text>
    <text x="450" y="502" fill="#6ee7b7" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">4n6mount · vfs stack (forensic-vfs · forensic-vfs-engine · forensic-vfs-mount)</text>

    <!-- ===== band 4: INTERPRET ===== -->
    <text x="40" y="584" fill="#475569" font-size="8" font-family="ui-monospace, monospace" letter-spacing="2">INTERPRET ARTIFACTS</text>
    <rect x="40" y="590" width="560" height="170" rx="6" fill="#0f172a"/>
    <rect x="40" y="590" width="560" height="170" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="320" y="612" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">parser/ (25)</text>
    <text x="320" y="630" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">medium-agnostic: Path or &amp;[u8] in → typed events + findings out</text>
    <text x="320" y="654" fill="#67e8f9" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">amcache · atx · bam · blob-decoder · bluetooth · browser · cfb · ese</text>
    <text x="320" y="670" fill="#67e8f9" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">exec-pe · leveldb · lnk · peripheral · prefetch · protobuf · segb</text>
    <text x="320" y="686" fill="#67e8f9" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">shellhist · shellitem · shimcache · snss · sqlite · srum · trash</text>
    <text x="320" y="702" fill="#67e8f9" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">usb · userassist · winreg</text>
    <rect x="620" y="590" width="240" height="52" rx="6" fill="#0f172a"/>
    <rect x="620" y="590" width="240" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="740" y="611" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">log/ (2)</text>
    <text x="740" y="628" fill="#67e8f9" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">journald · winevt</text>
    <rect x="620" y="652" width="240" height="50" rx="6" fill="#0f172a"/>
    <rect x="620" y="652" width="240" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="740" y="672" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">graph/ (1)</text>
    <text x="740" y="688" fill="#67e8f9" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">git-forensic</text>
    <rect x="620" y="712" width="240" height="48" rx="6" fill="#0f172a"/>
    <rect x="620" y="712" width="240" height="48" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="740" y="731" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">history/ (3) · [H]</text>
    <text x="740" y="747" fill="#67e8f9" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">snapshot · state-history · vsc</text>

    <!-- ===== band 5: CORRELATE ===== -->
    <text x="40" y="794" fill="#475569" font-size="8" font-family="ui-monospace, monospace" letter-spacing="2">CORRELATE &amp; REPORT</text>
    <rect x="40" y="800" width="820" height="80" rx="6" fill="#0f172a"/>
    <rect x="40" y="800" width="820" height="80" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="450" y="826" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">orchestration/ (3)</text>
    <text x="450" y="844" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">disk-forensic · issen · useract-forensic</text>
    <text x="450" y="862" fill="#c4b5fd" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">cross-artifact correlation → one DuckDB timeline · forensicnomicon::report findings</text>

    <!-- ===== side rail: cross-cutting ===== -->
    <rect x="890" y="110" width="270" height="770" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8,4"/>
    <text x="1025" y="132" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace" letter-spacing="1">CROSS-CUTTING · linked by every layer</text>

    <rect x="910" y="150" width="230" height="76" rx="6" fill="#0f172a"/>
    <rect x="910" y="150" width="230" height="76" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1025" y="172" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">knowledge/ (2)</text>
    <text x="1025" y="188" fill="#64748b" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">FOUNDATION layer · zero fleet deps</text>
    <text x="1025" y="206" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">forensicnomicon · forensic-hashdb</text>

    <rect x="910" y="248" width="230" height="150" rx="6" fill="#0f172a"/>
    <rect x="910" y="248" width="230" height="150" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1025" y="270" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">utility/ (7)</text>
    <text x="1025" y="286" fill="#64748b" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">owns no format · serves many layers</text>
    <text x="1025" y="310" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">safe-read · jsonguard</text>
    <text x="1025" y="326" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">blazehash · timeglyph</text>
    <text x="1025" y="342" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">forensic-carve · shrinkpath</text>
    <text x="1025" y="358" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">name-variants</text>

    <rect x="910" y="420" width="230" height="70" rx="6" fill="#0f172a"/>
    <rect x="910" y="420" width="230" height="70" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1025" y="442" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">codec/ (3)</text>
    <text x="1025" y="458" fill="#64748b" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">pure-Rust decompressors</text>
    <text x="1025" y="476" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="ui-monospace, monospace">lzo · lzvn · xpress-huffman</text>

    <rect x="910" y="512" width="230" height="70" rx="6" fill="#0f172a"/>
    <rect x="910" y="512" width="230" height="70" rx="6" fill="rgba(30,41,59,0.35)" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="1025" y="534" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">_deprecated/ (2)</text>
    <text x="1025" y="552" fill="#64748b" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">ewf → superseded by ewf-forensic</text>
    <text x="1025" y="566" fill="#64748b" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">usnjrnl-forensic → into ntfs-forensic</text>

    <text x="1025" y="612" fill="#475569" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">taxonomy (2026-07-28 rulings):</text>
    <text x="1025" y="626" fill="#475569" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">codec/ own folder · vfs/ dissolved into</text>
    <text x="1025" y="640" fill="#475569" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">filesystem+orchestration · ad1 → container</text>
    <text x="1025" y="662" fill="#475569" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">folders = where a human looks;</text>
    <text x="1025" y="676" fill="#475569" font-size="8" text-anchor="middle" font-family="ui-monospace, monospace">conceptual tiers (ADR-0016) = release order</text>

    <!-- ===== legend (below all boundaries) ===== -->
    <g font-family="ui-monospace, monospace">
      <rect x="40" y="908" width="12" height="12" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
      <text x="58" y="918" fill="#94a3b8" font-size="8">decode / acquire</text>
      <rect x="180" y="908" width="12" height="12" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
      <text x="198" y="918" fill="#94a3b8" font-size="8">volumes / orchestration</text>
      <rect x="370" y="908" width="12" height="12" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1"/>
      <text x="388" y="918" fill="#94a3b8" font-size="8">crypto</text>
      <rect x="460" y="908" width="12" height="12" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
      <text x="478" y="918" fill="#94a3b8" font-size="8">filesystem</text>
      <rect x="570" y="908" width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="588" y="918" fill="#94a3b8" font-size="8">interpretation</text>
      <rect x="700" y="908" width="12" height="12" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="718" y="918" fill="#94a3b8" font-size="8">cross-cutting</text>
      <text x="40" y="948" fill="#475569" font-size="8">repo names shown without the -forensic suffix where unambiguous · every box is independent git repos, gitignored by the umbrella</text>
    </g>
  </svg>
